name: Verify mobile
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: cp .env.example .env.local
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
